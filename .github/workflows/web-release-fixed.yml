name: Smart Flow BW Web Release Fixed
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate navigation and runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          required=['Smart Flow BW','Before Your Bill','Thothi','Overnight leak','High flow / burst risk','Usage improving','Evening spike','id="overview"','id="alerts"','id="save"','id="devices"','id="account"','Run 24h','smartflow-runtime.js','auth-admin.js']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          tabs=set(re.findall(r'data-tab="([^"]+)"',t)); screens=set(re.findall(r'<section id="([^"]+)"',t))
          expected={'overview','bill','alerts','thothi','save','devices','account'}
          if not expected <= tabs or not expected <= screens: raise SystemExit('Navigation/screen mismatch')
          print('Smart Flow web release validation: PASS')
          PY
          node --check auth-admin.js
          node --check smartflow-runtime.js
      - name: Build verified downloadable web app
        run: |
          rm -rf site
          mkdir site
          cp index.html auth-admin.js smartflow-runtime.js local-core.js manifest.webmanifest icon.svg site/
          [ ! -f sw.js ] || cp sw.js site/
          cd site
          zip -9 ../Smart-Flow-BW-Web-App.zip ./*
          cd ..
          unzip -t Smart-Flow-BW-Web-App.zip
          test -s Smart-Flow-BW-Web-App.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Flow-BW-Web-App-Fixed
          path: Smart-Flow-BW-Web-App.zip
          if-no-files-found: error
          retention-days: 30
