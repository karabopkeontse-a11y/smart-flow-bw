name: Build Smart Flow BW Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize shared web runtime into Android assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('index.html')
          asset=Path('android/app/src/main/assets')
          asset.mkdir(parents=True,exist_ok=True)
          text=root.read_text(encoding='utf-8')
          for name in ['index.html','auth-admin.js','smartflow-runtime.js','local-core.js']:
              src=Path(name)
              if src.exists():
                  (asset/name).write_text(src.read_text(encoding='utf-8'),encoding='utf-8')
          PY
          git config user.name 'smart-flow-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add android/app/src/main/assets/index.html android/app/src/main/assets/auth-admin.js android/app/src/main/assets/smartflow-runtime.js android/app/src/main/assets/local-core.js
          if ! git diff --cached --quiet; then git commit -m 'Sync shared Smart Flow web runtime into Android assets [skip ci]'; git push; fi
      - name: Validate JavaScript runtime
        run: |
          node --check auth-admin.js
          node --check smartflow-runtime.js
          node --check local-core.js
      - name: Smoke test offline Smart Flow demo
        run: python3 scripts/smoke_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Prepare downloadable package
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Smart-Flow-BW-Thothi-debug.apk
          cp README.md release/README.md
          cd release
          zip -9 Smart-Flow-BW-Thothi-Package.zip Smart-Flow-BW-Thothi-debug.apk README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Flow-BW-Thothi-App-Package
          path: release/
