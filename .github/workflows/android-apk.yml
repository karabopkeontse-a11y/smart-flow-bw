name: Build Smart Flow BW Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize web HTML and account asset without replacing Android demo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('index.html')
          asset=Path('android/app/src/main/assets/index.html')
          text=root.read_text(encoding='utf-8')
          tag='<script src="./auth-admin.js"></script>'
          if tag not in text:
              text=text.replace('</body>',tag+'\n</body>')
              root.write_text(text,encoding='utf-8')
          asset.parent.mkdir(parents=True,exist_ok=True)
          # Keep the web and APK HTML identical so every build contains the latest UI.
          asset.write_text(text,encoding='utf-8')
          (asset.parent/'auth-admin.js').write_text(Path('auth-admin.js').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          git config user.name 'smart-flow-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html android/app/src/main/assets/index.html android/app/src/main/assets/auth-admin.js
          if ! git diff --cached --quiet; then git commit -m 'Sync Smart Flow HTML and account layer [skip ci]'; git push; fi
      - name: Validate account layer JavaScript
        run: node --check auth-admin.js
      - name: Smoke test offline Smart Flow demo
        run: python3 scripts/smoke_test.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Prepare downloadable package
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/Smart-Flow-BW-Thothi-debug.apk
          cp README.md release/README.md
          cd release
          zip -9 Smart-Flow-BW-Thothi-Package.zip Smart-Flow-BW-Thothi-debug.apk README.md
      - uses: actions/upload-artifact@v4
        with:
          name: Smart-Flow-BW-Thothi-App-Package
          path: release/
