name: Smart Flow BW Release Guard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply idempotent release hardening
        run: python3 scripts/hardening.py
      - name: Synchronize Android web assets from the web source of truth
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html auth-admin.js smartflow-runtime.js local-core.js android/app/src/main/assets/
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check auth-admin.js
          node --check smartflow-runtime.js
          node --check local-core.js
      - name: Run static smoke test
        run: python3 scripts/smoke_test.py
      - name: Install Playwright browser for behavioural smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run behavioural smoke test
        run: node scripts/e2e_smoke.mjs
      - name: Persist hardened source and synchronized Android assets
        run: |
          git config user.name 'smart-flow-release-guard'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html auth-admin.js smartflow-runtime.js local-core.js sw.js android/app/src/main/assets/ scripts/
          if git diff --cached --quiet; then
            echo 'No source changes required.'
          else
            git commit -m 'Harden Smart Flow release and sync Android assets [skip ci]'
            git push
          fi
