name: Smart Flow BW Web Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check local-core.js
          node --check auth-admin.js
          node --check smartflow-runtime.js
          node --check upgrade.js
          node --check local-auth-compat.js
          node --check smartflow-hardening.js
      - name: Validate Smart Flow navigation and runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          required=['Smart Flow BW','Before Your Bill','Thothi','Overnight leak','High flow / burst risk','Usage improving','Evening spike','id="overview"','id="alerts"','id="save"','id="devices"','id="account"','Run 24h','smartflow-runtime.js','auth-admin.js']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing web surface: '+', '.join(missing))
          tabs=set(re.findall(r'data-tab="([^"]+)"',t)); screens=set(re.findall(r'<section id="([^"]+)"',t)); expected={'overview','bill','alerts','thothi','save','devices','account'}
          if not expected <= tabs or not expected <= screens: raise SystemExit('Navigation/screen mismatch')
          print('Navigation surface: PASS')
          print('Tabs:', ', '.join(sorted(tabs & expected)))
          PY
      - name: Assemble downloadable web app
        run: |
          rm -rf site
          mkdir -p site
          cp index.html app.js local-core.js auth-admin.js smartflow-runtime.js upgrade.js local-auth-compat.js smartflow-hardening.js manifest.webmanifest icon.svg site/
          if [ -f sw.js ]; then cp sw.js site/; fi
          if [ -f service-worker.js ]; then cp service-worker.js site/; fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          t=p.read_text(encoding='utf-8')
          for src in ('./upgrade.js','./local-auth-compat.js','./smartflow-hardening.js'):
              if src not in t: t=t.replace('</body>',f'<script src="{src}"></script></body>')
          p.write_text(t,encoding='utf-8')
          PY
          test -s site/index.html && test -s site/smartflow-hardening.js && test -s site/icon.svg
          grep -q 'smartflow-hardening.js' site/index.html
      - name: Create verified web ZIP
        run: |
          cd site
          zip -9 ../Smart-Flow-BW-Web-App.zip ./*
          cd ..
          unzip -t Smart-Flow-BW-Web-App.zip
          test -s Smart-Flow-BW-Web-App.zip
      - name: Upload downloadable web app
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Flow-BW-Web-App
          path: Smart-Flow-BW-Web-App.zip
          if-no-files-found: error
          retention-days: 30
