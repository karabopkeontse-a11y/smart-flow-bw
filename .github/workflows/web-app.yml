name: Smart Flow BW Web Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check local-core.js
          node --check auth-admin.js
          node --check smartflow-runtime.js
      - name: Validate Smart Flow web surface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          t=Path('index.html').read_text(encoding='utf-8')
          required=['Smart Flow BW','Before Your Bill','Thothi','Overnight leak','High flow / burst risk','Usage improving','Evening spike','id="thothi"','id="overview"','id="alerts"','id="save"','id="devices"','sfDevicePanel','data-action="prev"','data-action="next"','data-action="run"','smartflow-runtime.js','auth-admin.js']
          missing=[x for x in required if x not in t]
          if missing: raise SystemExit('Missing web feature(s): '+', '.join(missing))
          print('Smart Flow web surface validation: PASS')
          PY
      - name: Assemble downloadable web app
        run: |
          rm -rf site
          mkdir -p site
          cp index.html app.js local-core.js auth-admin.js smartflow-runtime.js manifest.webmanifest icon.svg site/
          if [ -f sw.js ]; then cp sw.js site/; fi
          if [ -f service-worker.js ]; then cp service-worker.js site/; fi
          cat > site/README.txt <<'EOF'
          Smart Flow BW — Web App
          Open index.html in a modern browser. This package contains the synchronized UI, Thothi rule-based intelligence, simulation, alerts, tasks, accounts and household/device demo layer.
          EOF
          test -s site/index.html
          test -s site/smartflow-runtime.js
      - name: Create web ZIP
        run: |
          cd site
          zip -9 ../Smart-Flow-BW-Web-App.zip *
      - name: Upload downloadable web app
        uses: actions/upload-artifact@v4
        with:
          name: Smart-Flow-BW-Web-App
          path: |
            site/
            Smart-Flow-BW-Web-App.zip
          retention-days: 30
