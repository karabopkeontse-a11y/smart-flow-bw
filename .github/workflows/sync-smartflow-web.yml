name: Sync Smart Flow web and Android assets
on:
  push:
    paths:
      - 'auth-admin.js'
      - 'local-core.js'
      - 'smartflow-runtime.js'
      - 'index.html'
      - 'build-trigger.txt'
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject and synchronize shared app assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text()
          tag='<script src="./auth-admin.js"></script>'
          if tag not in t:
              t=t.replace('</body>', tag+'\n</body>')
              p.write_text(t)
          a=Path('android/app/src/main/assets')
          a.mkdir(parents=True,exist_ok=True)
          for name in ['index.html','local-core.js','auth-admin.js','smartflow-runtime.js']:
              src=Path(name)
              if src.exists(): (a/name).write_text(src.read_text())
          PY
      - name: Commit synchronized assets
        run: |
          git config user.name 'smart-flow-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html android/app/src/main/assets/index.html android/app/src/main/assets/local-core.js android/app/src/main/assets/auth-admin.js android/app/src/main/assets/smartflow-runtime.js
          git diff --cached --quiet || git commit -m 'Sync web HTML and Android assets'
          git push
