name: Sync Smart Flow web and Android assets
on:
  push:
    paths:
      - 'auth-admin.js'
      - 'local-core.js'
      - 'index.html'
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject account layer into HTML and Android assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          t=p.read_text()
          tag='<script src="./auth-admin.js"></script>'
          if tag not in t:
              t=t.replace('</body>', tag+'\n</body>')
              p.write_text(t)
          a=Path('android/app/src/main/assets')
          a.mkdir(parents=True,exist_ok=True)
          (a/'index.html').write_text(p.read_text())
          (a/'local-core.js').write_text(Path('local-core.js').read_text())
          (a/'auth-admin.js').write_text(Path('auth-admin.js').read_text())
          PY
      - name: Commit synchronized assets
        run: |
          git config user.name 'smart-flow-build-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html android/app/src/main/assets/index.html android/app/src/main/assets/local-core.js android/app/src/main/assets/auth-admin.js
          git diff --cached --quiet || git commit -m 'Sync web HTML and Android assets with account layer'
          git push
